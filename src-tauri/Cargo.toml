[package]
name = "amnesia-protocol"
version = "0.1.0"
description = "Local privacy review tool"
authors = ["Amnesia Protocol"]
edition = "2021"

[lib]
name = "amnesia_protocol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-clipboard-manager = "2.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
